plugins {
    id 'java-library'
}

repositories {
    mavenCentral()
}

dependencies {
    // is required for compilation but will not be added to the resulting fat jar
    implementation 'com.corezoid.gitcall:runner:0.1.4'

    // add your dependencies here
    // they will be added to the resulting fat jar (usercode.jar)
    implementation 'com.squareup.okhttp3:okhttp:4.9.0'
    implementation 'com.google.code.gson:gson:2.8.6'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

/**
 * Copy fat jar to parent directory
 */
tasks.register('copyJarToRoot', Copy) {
    dependsOn(tasks.jar)

    from(tasks.jar)
    into(layout.projectDirectory.dir("../"))

    // Gradle 9 strict validation: declare output explicitly
    outputs.dir(layout.projectDirectory.dir("../"))
}

/**
 * Make build depend on copy task explicitly
 */
tasks.named('build') {
    dependsOn('copyJarToRoot')
}


tasks.named('test') {
    dependsOn('copyJarToRoot')
}

tasks.named('compileTestJava') {
    dependsOn('copyJarToRoot')
}

tasks.named('processTestResources') {
    dependsOn('copyJarToRoot')
}